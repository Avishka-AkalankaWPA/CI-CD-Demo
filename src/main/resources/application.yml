spring:
  application:
    name: news-cicd-demo
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: ${PORT:8080}

news:
  api:
    url: "${NEWS_API_URL:https://newsapi.org/v2/everything?q=bitcoin&apiKey=fafbb6496d3b41d4b412e2482b0e070c}"
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

app:
  environment: ${APP_ENV:Production}
  build-version: ${BUILD_VERSION:1.0.0-SNAPSHOT}
