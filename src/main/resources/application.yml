spring:
  application:
    name: news-cicd-demo
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: ${PORT:8080}

news:
  api:
    url: "https://api.spaceflightnewsapi.net/v4/articles/?limit=6"
    connect-timeout-ms: 5000
    read-timeout-ms: 5000

app:
  environment: ${APP_ENV:Production}
  build-version: ${BUILD_VERSION:1.0.0-SNAPSHOT}
